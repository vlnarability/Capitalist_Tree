# CI — continuous integration for The Capitalist Tree (GAP-32, P12-D).
#
# Runs on every push (all branches — feature branches get the full CI gate,
# not just main) and on pull requests to main. Verifies the full monorepo:
# install (frozen lockfile), typecheck, lint, unit/integration tests (vitest
# across all packages + repo-root acceptance tests), and a production build
# of every package + the web app.
#
# The test step uses the root `pnpm test` script, which sets
# `NODE_OPTIONS='--max-old-space-size=4096'` (the simulation's long-running
# weather/offline-catch-up tests need the expanded heap). The simulation
# suite is headless (no browser) — only the Playwright e2e job (below)
# needs a browser; it is split out so a browser install doesn't slow the
# core feedback loop.
#
# Matrix: Node 22 (LTS) on ubuntu-latest. The engine + package.json declare
# `engines.node >= 20`; pnpm 12.18.0 is pinned via `packageManager` and read
# from there by pnpm/action-setup (no separate version field needed). Bumped
# from Node 20 (EOL on GitHub Actions runners — the deprecation notice forced
# the actions to Node 24 while the job stayed on 20, a confusing split).

name: CI

on:
  # No `branches` filter on push → runs on EVERY branch push (feature branches
  # like gap-* / p* / docs/* get the full gate, not just main). This lets the
  # agent run a fast local subset (touched tests + typecheck) per turn and rely
  # on CI for the full regression. `concurrency.cancel-in-progress` below keeps
  # repeated re-pushes cheap (a new push cancels the superseded run).
  push:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (saves CI minutes when a branch is
# pushed to repeatedly).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # core: typecheck + lint + unit/integration tests + build
  # ──────────────────────────────────────────────────────────────────────
  core:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm (from packageManager field)
        uses: pnpm/action-setup@v4
        # version is read from package.json `packageManager`

      - name: Setup Node 22 (with pnpm store cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all packages)
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit + integration tests (vitest, all packages)
        run: pnpm test

      - name: Build (all packages + web)
        run: pnpm build

  # ──────────────────────────────────────────────────────────────────────
  # e2e: Playwright smoke suite (split out — needs a browser install)
  # ──────────────────────────────────────────────────────────────────────
  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22 (with pnpm store cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Playwright needs its browser binaries downloaded once per runner.
      # `pnpm --filter web exec playwright install --with-deps` installs the
      # browser binaries + system deps (libnss3, etc.) each engine needs.
      # P13-C (GAP-37): all three engines — chromium, firefox, webkit — so the
      # smoke suite runs cross-browser (one matrix entry per project in
      # playwright.config.ts; a per-browser failure surfaces distinctly).
      #
      # Cache the browser binaries (~/.cache/ms-playwright, ~150MB × 3 engines)
      # keyed on the lockfile — the single biggest e2e cost after the dep
      # install. On a cache HIT the binaries restore in seconds + we only re-
      # install the system libs (`playwright install-deps`); on a MISS we
      # download + install everything (`--with-deps`).
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers + system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system deps only (browsers cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium firefox webkit

      - name: Run e2e smoke suite
        run: pnpm --filter web test:e2e
